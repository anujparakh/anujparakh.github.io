name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - apps-home
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only publish the page itself (keeps .github etc. out of the site)
      - name: Prepare site folder
        run: mkdir dist && cp index.html dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=apps-home --branch=main
